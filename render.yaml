# Persona — Render "Deploy to Render" blueprint (free tier).
# Blueprint button: https://render.com/new?snippet=<github-url>/blob/master/render.yaml
# Creates the backend + Redis pair and wires secrets/URLs automatically.
services:
  - type: web
    name: persona-api
    runtime: docker
    plan: free
    dockerfilePath: ./docker/Dockerfile.server
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects $PORT on free instances; the server honors PORT (see apps/server/src/core/config.ts).
      - key: ALLOWED_ORIGINS
        value: https://persona-chat.vercel.app,https://persona-lovat-xi.vercel.app
      - key: INVITE_BASE_URL
        value: https://persona-chat.vercel.app
      - key: SESSION_JWT_SECRET
        generateValue: true
      - key: PARTNER_CONTROL_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: redis
          name: persona-redis
          property: connectionString
    healthCheckPath: /api/health
    autoDeploy: true

  - type: redis
    name: persona-redis
    plan: free
    # Persona is ephemeral by design — no persistence needed.
    ipAllowList: []  # allow any source (public demo)
