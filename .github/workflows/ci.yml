name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (lint, typecheck, test)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build shared
        run: npm run build:shared
      - name: Lint
        run: npm run lint -w @ghostlink/server
      - name: Typecheck
        run: npm run typecheck -w @ghostlink/server
      - name: Build server
        run: npm run build -w @ghostlink/server
      - name: Unit + e2e tests
        run: npm run test:server
        env:
          REDIS_URL: redis://localhost:6379

  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate PWA icons
        run: npm run generate-icons
      - name: Build shared
        run: npm run build:shared
      - name: Lint
        run: npm run lint -w @ghostlink/web
      - name: Typecheck
        run: npm run typecheck -w @ghostlink/web
      - name: Unit tests
        run: npm run test:web
      - name: Production build
        run: npm run build -w @ghostlink/web

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.server
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
